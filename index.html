<!-- JavaScript for Navigation, Active Tab Highlighting, Filtering & Slideshow -->
  <script>
    // Mobile Menu Toggle & Active Tab Highlighting
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    const navItems = document.querySelectorAll('.nav-link:not(.cta-quote)');
    const sections = document.querySelectorAll('main section[id]');

    menuToggle.addEventListener('click', () => {
      const expanded = menuToggle.getAttribute('aria-expanded') === 'true' || false;
      menuToggle.setAttribute('aria-expanded', !expanded);
      navLinks.classList.toggle('open');
    });

    // Highlight clicked tab & close mobile menu
    navItems.forEach(link => {
      link.addEventListener('click', function() {
        // Remove active class from all tabs
        navItems.forEach(item => item.classList.remove('active'));
        // Add active class to the clicked tab
        this.classList.add('active');

        // Close mobile menu
        navLinks.classList.remove('open');
        menuToggle.setAttribute('aria-expanded', 'false');
      });
    });

    // Automatically highlight active tab on scroll
    window.addEventListener('scroll', () => {
      let current = '';
      const scrollPosition = window.scrollY + 150; // Offset for sticky header

      sections.forEach(section => {
        const sectionTop = section.offsetTop;
        const sectionHeight = section.offsetHeight;
        if (scrollPosition >= sectionTop && scrollPosition < sectionTop + sectionHeight) {
          current = section.getAttribute('id');
        }
      });

      if (current) {
        navItems.forEach(item => {
          item.classList.remove('active');
          if (item.getAttribute('href') === `#${current}`) {
            item.classList.add('active');
          }
        });
      }
    });

    // Typing Effect in Banner
    const roles = [
      "Empowering Businesses & Learners with Reliable Tech",
      "Professional Computer Repair & Network Setup",
      "Expert Software Installation & TVET Training"
    ];
    let roleIndex = 0;
    let charIndex = 0;
    let isDeleting = false;
    const typedRole = document.getElementById("typedRole");

    function typeEffect() {
      const currentRole = roles[roleIndex];
      if (isDeleting) {
        typedRole.textContent = currentRole.substring(0, charIndex - 1);
        charIndex--;
      } else {
        typedRole.textContent = currentRole.substring(0, charIndex + 1);
        charIndex++;
      }

      let typingSpeed = isDeleting ? 40 : 80;

      if (!isDeleting && charIndex === currentRole.length) {
        typingSpeed = 2000;
        isDeleting = true;
      } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        roleIndex = (roleIndex + 1) % roles.length;
        typingSpeed = 500;
      }
      setTimeout(typeEffect, typingSpeed);
    }
    setTimeout(typeEffect, 1000);

    // Hero Slideshow
    const slides = document.querySelectorAll('.slide-img');
    const dots = document.querySelectorAll('.dot');
    let currentSlide = 0;
    let slideInterval;

    function showSlide(index) {
      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === index);
        dots[i].classList.toggle('active', i === index);
      });
      currentSlide = index;
    }

    function nextSlideFunc() {
      let next = (currentSlide + 1) % slides.length;
      showSlide(next);
    }

    function prevSlideFunc() {
      let prev = (currentSlide - 1 + slides.length) % slides.length;
      showSlide(prev);
    }

    document.getElementById('nextSlide').addEventListener('click', () => {
      nextSlideFunc();
      resetTimer();
    });

    document.getElementById('prevSlide').addEventListener('click', () => {
      prevSlideFunc();
      resetTimer();
    });

    dots.forEach((dot, index) => {
      dot.addEventListener('click', () => {
        showSlide(index);
        resetTimer();
      });
    });

    function resetTimer() {
      clearInterval(slideInterval);
      slideInterval = setInterval(nextSlideFunc, 3500);
    }
    slideInterval = setInterval(nextSlideFunc, 3500);

    // Service Filtering
    const filterButtons = document.querySelectorAll('.filter-btn');
    const serviceCards = document.querySelectorAll('#servicesGrid .card');

    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        filterButtons.forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');

        const filterValue = button.getAttribute('data-filter');

        serviceCards.forEach(card => {
          const category = card.getAttribute('data-category');
          if (filterValue === 'all' || category === filterValue) {
            card.classList.remove('hidden-card');
          } else {
            card.classList.add('hidden-card');
          }
        });
      });
    });
  </script>
